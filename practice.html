<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="quiz_icon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cadet Quiz">
  <title>Practice Sheet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=JetBrains+Mono:wght@500&display=swap');
    :root {
      --bg: #0f1216;
      --panel: #1a1f27;
      --border: #2a323d;
      --amber: #ffb020;
      --text: #eef1f5;
      --text-faint: #626b78;
      --font-display: 'Rajdhani', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .top-bar .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 0;
    }
    .top-bar h1 {
      font-family: var(--font-display);
      font-size: 18px;
      margin: 0;
      color: var(--amber);
    }
    iframe {
      display: block;
      width: 100vw;
      height: calc(100vh - 116px);
      border: none;
    }
    .back-btn {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px;
      z-index: 100;
      text-align: center;
    }
    .btn {
      background-color: var(--amber);
      color: #14181e;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-family: var(--font-display);
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }
    @media (max-width: 600px) {
      .btn {
        width: 100%;
        font-size: 18px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      <p class="eyebrow">SASP &middot; Reference</p>
      <h1>Cadet Sheet</h1>
    </div>
  </div>
  <iframe src="cadet.html"></iframe>
  <div class="back-btn">
    <button class="btn" onclick="window.location.href='index.html'">Back to Quiz</button>
  </div>
</body>
</html>
