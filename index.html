<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="quiz_icon.ico" type="image/x-icon" />
  <title>Milo's Cadet Sheet Quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="main.js"></script>
  <link rel="stylesheet" href="styles.css" />

  <!-- Apple Stuff -->
  <link rel="apple-touch-icon" href="Quiz_Icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Milo's Cadet Quiz">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">


</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="badge-mark" aria-hidden="true">&#9733;</div>
      <div>
        <p class="eyebrow">SASP &middot; Cadet Division</p>
        <h1>Milo's Cadet Quiz</h1>
      </div>
    </header>

    <div id="section-select">
      <div class="panel">
        <div class="panel-head">
          <span class="tag">Step 1</span>
          <h3>Select sections to study</h3>
        </div>
        <div class="section-list" id="section-list"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span class="tag">Step 2</span>
          <h3>10-code difficulty</h3>
        </div>
        <div class="mode-choice">
          <label><input type="radio" name="codeMode" value="easy" checked> Easy</label>
          <label><input type="radio" name="codeMode" value="hard"> Hard</label>
        </div>
      </div>

      <div class="bottom-buttons" id="start-controls">
        <button class="btn btn-secondary" onclick="selectAllSections()">Select All Sections</button>
        <button class="btn" onclick="startQuiz()">Start Quiz</button>
        <button class="btn btn-secondary" onclick="window.location.href='practice.html'">Practice</button>
      </div>
    </div>

    <div id="quiz" style="display: none;">
      <div class="quiz-card">
        <div class="quiz-card-head">
          <span class="case-no" id="progress"></span>
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>

    <div class="bottom-buttons" id="quiz-controls" style="display: none;">
      <button class="btn" onclick="submitAnswer()" id="submit-btn">Submit Answer</button>
      <button class="btn-exit" onclick="exitQuiz()">Exit</button>
    </div>
  </div>
</body>
</html>
